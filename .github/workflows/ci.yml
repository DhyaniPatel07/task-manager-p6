name: Task Manager CI Pipeline

# Trigger on push or pull request to main, plus manual trigger
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─── 1. Backend CI Job ──────────────────────────────────────────────────────
  backend-ci:
    name: Backend Tests (Jest & Supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Automated Tests
        run: npm test
        env:
          NODE_ENV: test
          # No database credentials required for CI tests

  # ─── 2. Frontend CI Job ─────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend Production Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/template

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/template/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

